[project]
name = "ai-assignments"
version = "0.1.0"
description = "Problem 2: AI model fallback system, Problem 3: smart lead extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "anthropic",
    "python-dotenv",
    "chromadb>=1.5.9",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false
